{% extends 'base.html' %}

{% block title %}GG-Reviews | Iniciar Sesión{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="ph-fill ph-game-controller auth-icon"></i>
            <h2>Bienvenido de Vuelta</h2>
            <p>Inicia sesión para continuar reseñando</p>
        </div>
        
        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="input-group">
                <label for="username">Usuario</label>
                <div class="input-wrapper">
                    <i class="ph ph-user"></i>
                    <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required>
                </div>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
        </form>
        
        <div class="auth-footer">
            <p>¿No tienes una cuenta? <a href="{{ url_for('register') }}">Regístrate gratis</a></p>
        </div>
    </div>
</div>
{% endblock %}
